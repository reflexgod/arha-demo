  <!-- =====================================================================
       RIYA, ARHA'S ASSISTANT (chat webhook). Written into the pages by tools/pages.py only while
       SITE["riyaEnabled"] is True and SITE["riya_webhook_url"] is set; otherwise no launcher, no
       teaser and no chat code are published. Only the launcher is drawn on load; assets/js/riya.js
       (the chat window) loads on the first click. Opening the chat sends nothing; only a sent
       message calls the webhook.
       ===================================================================== -->
  <script type="module">
    // The webhook URL lives in SITE (tools/pages.py), written into the page's #site-config
    const SITE_CONFIG = JSON.parse(document.getElementById('site-config').textContent);
    const RIYA_WEBHOOK_URL = SITE_CONFIG.riyaWebhookUrl;
    // Teaser: at most once per visit, only after the visitor has scrolled past the hero (so it never covers
    // the heading, the line under it or its button), never after the chat was opened or the teaser dismissed
    const RIYA_BUBBLE = {
      text: 'Have a question or planning a visit? I’m Riya, Arha’s assistant.',
      options: ['Request an appointment', 'Ask a question'],
      hideAfter: 8000,  // it leaves on its own after 8 s, or after 600 px more scrolling
      hideScroll: 600,
    };

    if (RIYA_WEBHOOK_URL) {
      const base = document.querySelector('link[href$="site.css"]').href.replace(/css\/site\.css$/, '');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const icon = '<svg viewBox="0 0 919.25 902.15" aria-hidden="true" focusable="false"><use href="#arha-icon"/></svg>';
      const track = window.arhaTrack || (() => {});
      const seen = (key) => { try { return Boolean(sessionStorage.getItem(key)); } catch (e) { return true; } };
      const remember = (key) => { try { sessionStorage.setItem(key, '1'); } catch (e) { /* storage blocked */ } };

      const launcher = document.createElement('button');
      launcher.type = 'button';
      launcher.className = 'riya-launcher';
      launcher.setAttribute('aria-label', 'Ask Riya, Arha’s assistant');
      launcher.setAttribute('aria-expanded', 'false');
      launcher.innerHTML = icon;
      document.body.append(launcher);

      // One load and one chat window, however many clicks arrive. The first click shows the window at
      // once ("Connecting…") and riya.js fills it when it has loaded; clicks during loading are ignored.
      let chat = null;
      let chatPromise = null;
      const getChat = () => {
        if (!chatPromise) {
          const panel = document.createElement('section');
          panel.className = 'riya';
          panel.id = 'riya';
          panel.setAttribute('role', 'dialog');
          panel.setAttribute('aria-label', 'Riya');
          panel.innerHTML = '<p class="riya__loading">Connecting…</p>';
          document.body.append(panel);
          requestAnimationFrame(() => panel.classList.add('is-open'));
          launcher.classList.add('is-loading');
          launcher.setAttribute('aria-expanded', 'true');
          chatPromise = import(`${base}js/riya.js`)
            .then(({ mountRiya }) => { chat = mountRiya({ webhookUrl: RIYA_WEBHOOK_URL, phone: SITE_CONFIG.phone, launcher, panel }); return chat; })
            .catch((err) => { chatPromise = null; panel.remove(); launcher.setAttribute('aria-expanded', 'false'); throw err; })
            .finally(() => launcher.classList.remove('is-loading'));
        }
        return chatPromise;
      };

      let bubble = null;
      const hideBubble = () => {
        if (!bubble) return;
        const el = bubble;
        bubble = null;
        el.classList.remove('is-visible');
        setTimeout(() => el.remove(), reduceMotion ? 0 : 300);
      };

      launcher.addEventListener('click', async () => {
        hideBubble();
        remember('riya-opened');
        if (launcher.classList.contains('is-loading')) return;
        const first = !chat;
        const c = await getChat();
        if (first) c.open();
        else c.toggle();
      });

      if (!seen('riya-bubble') && !seen('riya-opened')) {
        // The hero: the page's first section (the homepage video, a page's photo hero, the emergency band)
        const hero = document.querySelector('main > section, main > header');
        const heroVisible = () => (hero ? hero.getBoundingClientRect().bottom > 0 : scrollY < innerHeight);
        const onScroll = () => { if (!heroVisible()) showBubble(); };
        function showBubble() {
          removeEventListener('scroll', onScroll);
          if (chat || chatPromise || bubble || seen('riya-opened') || seen('riya-bubble') || document.documentElement.classList.contains('is-locked')) return;
          remember('riya-bubble'); // once per visit: shown, dismissed or not
          bubble = document.createElement('div');
          bubble.className = 'riya-bubble';
          bubble.setAttribute('role', 'dialog');
          bubble.setAttribute('aria-label', 'Message from Riya');
          bubble.innerHTML = `<span class="riya-bubble__mark">${icon}</span><p class="riya-bubble__text"></p>
            <p class="riya-bubble__options"></p><button class="riya-bubble__close" type="button" aria-label="Dismiss"></button>`;
          bubble.querySelector('.riya-bubble__text').textContent = RIYA_BUBBLE.text;
          RIYA_BUBBLE.options.forEach((label) => {
            const option = document.createElement('button');
            option.type = 'button';
            option.textContent = label;
            option.addEventListener('click', async () => {
              track('riya_bubble_clicked', { option: label });
              hideBubble();
              remember('riya-opened');
              const c = await getChat(); // the message waits until the chat is ready
              c.open();
              c.ask(label);
            });
            bubble.querySelector('.riya-bubble__options').append(option);
          });
          bubble.querySelector('.riya-bubble__close').addEventListener('click', hideBubble);
          document.body.append(bubble);
          requestAnimationFrame(() => bubble && bubble.classList.add('is-visible'));
          track('riya_bubble_shown');
          // Never pushy: gone after 8 s or 600 px of scrolling (or as soon as the hero is back in view),
          // unless the visitor is using it
          const shownAt = scrollY;
          let hideTimer = setTimeout(hideBubble, RIYA_BUBBLE.hideAfter);
          const onAway = () => {
            if (Math.abs(scrollY - shownAt) < RIYA_BUBBLE.hideScroll && !heroVisible()) return;
            removeEventListener('scroll', onAway);
            hideBubble();
          };
          addEventListener('scroll', onAway, { passive: true });
          bubble.addEventListener('pointerenter', () => clearTimeout(hideTimer));
          bubble.addEventListener('focusin', () => clearTimeout(hideTimer));
          bubble.addEventListener('pointerleave', () => { hideTimer = setTimeout(hideBubble, 4000); });
        }
        addEventListener('scroll', onScroll, { passive: true });
      }

      // Other parts of the page open Riya here, optionally with a question typed in for the visitor to send
      window.arhaRiya = {
        open: async (prefill = '') => {
          hideBubble();
          remember('riya-opened');
          const c = await getChat();
          c.open();
          if (prefill) c.prefill(prefill);
        },
      };

      // ?riya=open opens the chat straight away (for showing the demo)
      if (new URLSearchParams(location.search).get('riya') === 'open') {
        remember('riya-opened');
        getChat().then((c) => c.open());
      }
    }
  </script>
