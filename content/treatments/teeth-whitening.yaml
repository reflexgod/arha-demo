sections:
  - label: about
    heading: "What is teeth whitening?"
    body: |
      <p>The active ingredient, usually hydrogen or carbamide peroxide, breaks down the stain molecules inside the
      enamel. In-clinic whitening uses a stronger gel with the gums protected; take-home whitening uses a milder gel in
      thin trays made to fit your teeth, worn for a set time each day.</p>
  - label: benefits
    heading: "Why we recommend professional whitening"
    body: |
      <ul>
        <li>It lightens your own teeth without drilling or covering them.</li>
        <li>The gel strength and the trays are matched to your teeth, which helps limit sensitivity.</li>
        <li>Your teeth and gums are checked first, so problems are not hidden under a brighter shade.</li>
      </ul>
  - label: who is it for?
    heading: "Am I a candidate for teeth whitening?"
    body: |
      <p>Whitening suits yellowish teeth stained by age, food and drink. It is not suitable during pregnancy or
      breastfeeding, for young teenagers, or while there is untreated decay or gum disease. Crowns, veneers and
      tooth-coloured fillings will not change colour, so they may need replacing to match afterwards.</p>
  - label: process
    heading: "Explaining whitening treatment"
    body: |
      <ol>
        <li><strong>Check-up.</strong> We examine your teeth and record the starting shade.</li>
        <li><strong>Preparation.</strong> A clean, and impressions or scans if trays are needed.</li>
        <li><strong>Whitening.</strong> In the clinic, at home, or both. [[TBC: Arha's method and number of sittings]]</li>
        <li><strong>Review.</strong> We check the new shade and your gums.</li>
      </ol>
  - label: aftercare
    heading: "Caring for your teeth after whitening"
    body: |
      <p>For a day or two after whitening, avoid strongly coloured food and drinks such as tea, coffee, red wine and
      turmeric-based curries. Brush twice a day and keep up regular cleaning. Some sensitivity is common for a few days
      and settles on its own; a toothpaste for sensitive teeth can help.</p>
  - label: related treatments
    heading: "When whitening is not enough"
    body: |
      <p>Chipped, worn or misshapen teeth, or a single dark tooth, may suit bonding, veneers or a crown instead. Read
      about <a href="/treatments/smile-design/">smile design</a>.</p>
  - label: faqs
    heading: "Find answers to popular whitening questions below"
    faqs:
      - q: "Is teeth whitening safe?"
        a: "Whitening with products used or supervised by a dentist is considered safe for the enamel. The most common side effect is temporary sensitivity. Whitening is not advised during pregnancy or breastfeeding."
      - q: "Is teeth whitening permanent?"
        a: "No. Results usually last from several months to a few years, depending on your diet and habits. Occasional top-ups keep the shade."
      - q: "Will whitening work on my crowns or fillings?"
        a: "No. Whitening only lightens natural tooth. Crowns, veneers and fillings stay the same colour and may need replacing to match."
      - q: "Is whitening safe for my teeth?"
        a: "Whitening supervised by a dentist, after your teeth and gums have been checked, is a well-established treatment. Some people notice short-lived sensitivity, which usually settles. Whitening does not change the colour of crowns, veneers or fillings."
