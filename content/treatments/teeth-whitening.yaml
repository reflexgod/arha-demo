h1: "Teeth whitening in South Mumbai"
answer: >-
  Professional teeth whitening lightens the natural colour of your teeth with a whitening gel, applied by the dentist or
  in custom trays at home. It is safe when supervised by a dentist, but it does not change the colour of crowns,
  veneers or fillings.
hero: hero-teeth-whitening
statement_h2: "Professional teeth whitening in South Mumbai, with your teeth checked first."
statement_p: >-
  Teeth darken over time with age and with tea, coffee, red wine, turmeric-rich food and smoking. Whitening gels
  release oxygen into the enamel and lift these stains, making the teeth several shades lighter. Before whitening, we
  examine your teeth and gums, because decay, gum problems or exposed roots need treating first, and because some
  discolouration, such as a single dark tooth, responds better to other treatments.
  [[TBC: whitening methods Arha offers (in-clinic, take-home or both)]]
