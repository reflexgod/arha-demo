slug: smile-design
nav_label: Smile design
title: "Smile Design in Mumbai | Arha Dental Care, Peddar Road"
description: "Smile design on Peddar Road, Mumbai: bonding, veneers, crowns and whitening planned around your face and bite by a prosthodontist."
h1: "Smile design in Mumbai"
answer: >-
  Smile design means planning changes to the shape, colour and position of your teeth so they suit your face and work
  with your bite. It can combine whitening, bonding, veneers, crowns or aligners, and you see the plan before any
  treatment begins.
hero: hero-smile-design
statement_h2: "Smile design in South Mumbai, planned around your face and your bite."
statement_p: >-
  People ask about smile design for chipped or worn teeth, gaps, uneven edges, old dark fillings or a colour they
  don't like. A good result looks natural and lasts, which means it has to fit how your teeth meet as well as how they
  look. As a prosthodontist, Dr. Nikhil V. Jain plans the shape and bite together, and keeps as much of your own tooth
  as possible. [[TBC: whether Arha uses digital smile planning or a trial mock-up]]
procedure:
  type: TherapeuticProcedure
  body_location: Teeth
  how_performed: "A plan combining whitening, composite bonding, veneers, crowns or aligners, depending on the teeth."
  preparation: "Examination, photographs, and a written plan."
  followup: "Review of the bite, then regular check-ups."
sections:
  - label: about
    heading: "What is smile design?"
    body: |
      <ul>
        <li><strong>Whitening</strong> to lighten the natural colour of your teeth.</li>
        <li><strong>Composite bonding</strong>: tooth-coloured resin added to repair chips and close small gaps, usually
        without drilling.</li>
        <li><strong>Veneers</strong>: thin porcelain shells bonded to the front of the teeth to change their shape and
        colour.</li>
        <li><strong>Crowns</strong> for teeth that are heavily filled, broken or root-treated.</li>
        <li><strong>Aligners</strong> to move teeth into a better position first.</li>
      </ul>
      <p>[[TBC: which of these Arha offers]]</p>
  - label: benefits
    heading: "Why we recommend planning the whole smile"
    body: |
      <ul>
        <li>Each change is chosen to suit your face, lips and gum line, so the result looks like you.</li>
        <li>Planning the bite helps restorations last and protects them from chipping.</li>
        <li>Starting with the least invasive option keeps more of your natural teeth.</li>
      </ul>
  - label: who is it for?
    heading: "Am I a candidate for smile design?"
    body: |
      <p>It suits adults with healthy gums who would like to change the look of their teeth: chipped, worn, uneven or
      discoloured teeth, gaps, or old fillings and crowns that no longer match. Decay and gum disease are treated
      first. If you grind your teeth, we plan for it, as grinding can damage new restorations.</p>
  - label: process
    heading: "Explaining smile design treatment"
    body: |
      <ol>
        <li><strong>Consultation.</strong> You tell us what you would like to change; we examine your teeth, gums and bite.</li>
        <li><strong>Records.</strong> Photographs, and impressions or scans.</li>
        <li><strong>The plan.</strong> We show you the proposed changes, the options and the estimate.</li>
        <li><strong>Treatment.</strong> Usually from the least to the most involved step, for example whitening before
        bonding so the new resin matches.</li>
      </ol>
  - label: aftercare
    heading: "Caring for your new smile"
    body: |
      <p>Brush twice a day, clean between your teeth, and come for regular check-ups and cleaning. Avoid biting very
      hard things such as ice or nuts in their shells with bonded or veneered teeth. If you grind your teeth at night,
      a night guard protects your new smile.</p>
  - label: related treatments
    heading: "Treatments often combined"
    body: |
      <p>See <a href="/treatments/teeth-whitening/">teeth whitening</a>,
      <a href="/treatments/aligners/">clear aligners</a> and
      <a href="/treatments/crowns-bridges-full-mouth-rehabilitation/">crowns and full-mouth rehabilitation</a>.</p>
  - label: faqs
    heading: "Find answers to popular smile design questions below"
    faqs:
      - q: "Do veneers damage your teeth?"
        a: "Porcelain veneers usually need a thin layer of enamel to be removed, which cannot be undone. Composite bonding often needs little or none. We explain how much each option changes your teeth before you decide."
      - q: "How long do veneers and bonding last?"
        a: "It varies with your bite, habits and care. Bonding may need polishing or repair over the years; porcelain veneers are more resistant to staining and chipping. We discuss the expected maintenance at your consultation."
      - q: "Can I see what my smile will look like?"
        a: "We go through the plan with you before treatment. [[TBC: mock-up or digital preview, if offered]]"
      - q: "Can I see what my new smile will look like first?"
        a: "Where it suits the treatment, changes can be planned with photographs and tried in the mouth before anything is final. [[TBC: whether Arha uses digital smile previews or trial mock-ups]]"
