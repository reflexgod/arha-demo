h1: "Crowns, bridges and full-mouth rehabilitation in Mumbai"
answer: >-
  Full-mouth rehabilitation restores worn, broken or missing teeth as one plan, so your bite works in balance again. It
  combines crowns, bridges, implants and fillings, and at Arha it is planned by a prosthodontist.
hero: hero-fmr
statement_h2: "Crowns, bridges and full-mouth rehabilitation in South Mumbai, planned by a prosthodontist."
statement_p: >-
  Teeth that are worn down, cracked, heavily filled or missing change the way the jaws meet. Repairing them one by one
  can leave the bite uneven, so new work chips or fails. Full-mouth rehabilitation looks at every tooth and at how your
  teeth come together, then restores them in a planned order. Restoring and replacing teeth is the specialty of a
  prosthodontist, and at Arha Dr. Nikhil V. Jain plans each case himself, from the first records to the final crowns.
  A single crown or a small bridge follows the same careful approach.
