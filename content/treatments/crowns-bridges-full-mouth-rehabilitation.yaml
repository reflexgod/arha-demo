sections:
  - label: about
    heading: "What are crowns, bridges and full-mouth rehabilitation?"
    body: |
      <p>Full-mouth rehabilitation, sometimes called full-mouth reconstruction, is a planned course of treatment that
      restores most or all of the teeth in both jaws. It can include crowns to protect weakened teeth, bridges or
      implants to replace missing ones, and fillings or root canal treatment where they are needed.</p>
      <p>A <strong>crown</strong> is a cap that covers a weakened tooth. A <strong>bridge</strong> fills a gap with a
      false tooth held by the teeth, or implants, on either side.</p>
  - label: benefits
    heading: "Why we recommend planning the whole mouth"
    body: |
      <ul>
        <li>Your bite is balanced as a whole, so chewing feels comfortable and even.</li>
        <li>New crowns and bridges are less likely to chip when the bite is right.</li>
        <li>The colour, shape and length of the teeth are planned together, so the result looks natural.</li>
        <li>Treatment follows one clear order, with costs set out in advance.</li>
      </ul>
  - label: who is it for?
    heading: "Am I a candidate for full-mouth rehabilitation?"
    body: |
      <p>It is usually considered when several of these apply: teeth worn down by grinding or acid, many large or old
      fillings, broken or cracked teeth, several missing teeth, or a bite that has collapsed so the face looks shorter.
      For one damaged tooth, a single crown is often enough, and we will tell you so.</p>
  - label: process
    heading: "Explaining full-mouth rehabilitation"
    body: |
      <p>Most cases take several visits over weeks to months, depending on how many teeth are involved and whether
      implants are part of the plan. [[TBC: Arha's typical timeline]]</p>
      <ol>
        <li><strong>Records.</strong> Examination, X-rays, photographs, models or scans, and a bite check.</li>
        <li><strong>Plan.</strong> A written plan with the order of treatment, the options and the costs.</li>
        <li><strong>Trial teeth.</strong> Where needed, provisional teeth let you try the new shape and bite first.</li>
        <li><strong>Final restorations.</strong> Crowns, bridges or implant teeth are made and fitted in stages.</li>
      </ol>
  - label: aftercare
    heading: "Caring for your crowns and bridges"
    body: |
      <p>Brush twice a day, and clean under bridges and between crowns with floss threaders or interdental brushes. If
      you grind your teeth, a night guard protects the new work. Regular check-ups let us spot small problems early.</p>
  - label: related treatments
    heading: "Crowns, bridges and implants"
    body: |
      <p>Missing teeth within the plan may be replaced with <a href="/treatments/dental-implants/">dental implants</a>
      or bridges. If you are deciding between them, see <a href="/treatments/missing-teeth/">implant, bridge or
      denture</a>.</p>
  - label: faqs
    heading: "Find answers to popular questions about crowns and full-mouth rehabilitation"
    faqs:
      - q: "Is full-mouth rehabilitation the same as a smile makeover?"
        a: "Not quite. A smile makeover mainly changes how the front teeth look. Full-mouth rehabilitation restores how all the teeth work together, and their appearance is planned as part of it."
      - q: "How long do crowns last?"
        a: "Crowns are designed to last many years. How long depends on the tooth underneath, your bite, grinding and how well the area is cleaned."
      - q: "What does full-mouth rehabilitation cost?"
        a: "Every plan is different, so the cost depends on how many teeth are treated and what each needs. You receive a written estimate after your consultation."
      - q: "Will I be without teeth during treatment?"
        a: "We plan the stages so that you have provisional teeth whenever they are needed. Ask us about your case at the consultation."
