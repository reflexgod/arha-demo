description: "Clear aligners on Peddar Road, Mumbai: how removable aligners straighten teeth, who they suit, how long treatment takes and how to look after them."
h1: "Clear aligners on Peddar Road"
answer: >-
  Clear aligners are thin, removable plastic trays that move your teeth a little at a time. You change to a new set
  every week or two, and wear them for most of the day. They suit many adults and teenagers with crowded or gapped teeth.
hero: hero-aligners
statement_h2: "Clear aligner treatment in South Mumbai, planned after a full examination."
statement_p: >-
  Aligners are planned on a 3D model of your teeth, so you can see the planned movement before treatment starts. Because
  they come out to eat and to clean your teeth, there are no food restrictions, but they only work if you wear them as
  prescribed. [[TBC: whether Arha provides aligner treatment, the aligner system used and provider status]]
