sections:
  - label: about
    heading: "How do clear aligners work?"
    body: |
      <p>Each set of aligners is shaped slightly differently from the last. Worn for most of the day, a set applies
      gentle pressure that moves the teeth towards the next stage. Small tooth-coloured bumps, called attachments, may be
      added to some teeth to help the aligners grip.</p>
  - label: benefits
    heading: "Why choose aligners?"
    body: |
      <ul>
        <li>They are clear, so most people won't notice them.</li>
        <li>They come out for eating, brushing and important occasions.</li>
        <li>There are no brackets or wires to rub the cheeks.</li>
      </ul>
  - label: who is it for?
    heading: "Are aligners right for me?"
    body: |
      <p>Aligners can treat many cases of crowding, spacing and some bite problems in adults and teenagers. Very complex
      bites may need fixed braces or a combination of treatments. Your gums need to be healthy before starting, and you
      need to wear the aligners for the hours prescribed, usually most of the day and night.</p>
  - label: process
    heading: "How long does aligner treatment take?"
    body: |
      <p>Treatment time depends on how far the teeth need to move: a few months for minor changes, longer for more
      complex cases. [[TBC: typical treatment times at Arha]]</p>
      <ol>
        <li><strong>Consultation and records.</strong> Examination, X-rays, photographs and a 3D scan.</li>
        <li><strong>Your plan.</strong> You see the planned tooth movement before deciding.</li>
        <li><strong>Treatment.</strong> New aligners every week or two, with regular check-ins.</li>
        <li><strong>Retainers.</strong> Worn afterwards to stop the teeth moving back.</li>
      </ol>
  - label: aftercare
    heading: "Looking after your aligners"
    body: |
      <p>Take the aligners out to eat and to drink anything other than water. Brush your teeth before putting them back,
      and rinse the aligners. After treatment, wear your retainers as advised: teeth tend to move back without them.</p>
  - label: related treatments
    heading: "Aligners and smile design"
    body: |
      <p>Straightening teeth first often makes whitening or bonding simpler. Read about
      <a href="/treatments/smile-design/">smile design</a> and <a href="/treatments/teeth-whitening/">teeth whitening</a>.</p>
  - label: faqs
    heading: "Questions we are often asked about aligners"
    faqs:
      - q: "Do aligners hurt?"
        a: "Most people feel pressure or mild soreness for a day or two when they start a new set. This is a sign the aligners are working and usually settles quickly."
      - q: "How many hours a day do I need to wear aligners?"
        a: "Usually most of the day and night, taking them out only to eat, drink and clean your teeth. Your plan sets the exact time."
      - q: "Do I need a retainer afterwards?"
        a: "Yes. Teeth tend to move back after any straightening treatment, so retainers are needed to keep the result."
