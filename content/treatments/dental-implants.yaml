h1: "Dental implants in South Mumbai, planned by a prosthodontist"
answer: >-
  A dental implant is a small titanium post placed in the jaw to hold a replacement tooth. At Arha, Dr. Nikhil V. Jain,
  a prosthodontist, plans the final tooth first and places the implant to suit it.
hero: hero-implants
statement_h2: "Prosthodontist-led dental implant care in South Mumbai, with every step explained before it begins."
statement_p: >-
  An implant replaces the root of a missing tooth, so the new tooth is held firmly in the jaw instead of resting on the
  gum or relying on the teeth beside it. A single implant can carry one crown, two or more can carry a bridge, and a
  few can hold a full denture in place. Because Dr. Nikhil V. Jain is a prosthodontist, a specialist in replacing and
  restoring teeth, your treatment starts with the tooth you will see and use, and the implant is planned around it.
  For anyone missing one tooth or several, implants are often the closest thing to having your own teeth back.
