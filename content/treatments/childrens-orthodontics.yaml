h1: "Orthodontics for children and teenagers in South Mumbai"
answer: >-
  Crooked, crowded or protruding teeth are common as children grow. An orthodontic check helps you understand whether
  your child needs treatment, when to start it, and which option suits them. [[TBC: who provides orthodontic
  treatment at Arha, and which appliances]]
hero: hero-childrens-orthodontics
statement_h2: "Orthodontic care for children in South Mumbai, planned around a growing smile."
statement_p: >-
  Children's teeth and jaws change quickly between the ages of about seven and fifteen. Some problems with the bite are
  easier to guide while a child is still growing; others are better treated once the adult teeth have come through.
  We examine your child, take the X-rays needed, and explain what we see in words they understand, so the whole family
  can decide together. [[TBC: orthodontic services offered at Arha]]
