nav_label: Root canal treatment
title: "Root Canal Treatment in South Mumbai | Arha Dental Care"
description: "Root canal treatment on Peddar Road, Mumbai: what it is, whether it hurts, how many visits it takes and how the tooth is protected afterwards."
h1: "Root canal treatment in South Mumbai"
answer: >-
  Root canal treatment removes infected or inflamed tissue from inside a tooth, cleans the canals and seals them, so you
  can keep the tooth. It is done under local anaesthetic, and the tooth is usually protected with a crown afterwards.
hero: hero-rct
statement_h2: "Root canal treatment in South Mumbai, done calmly and carefully to save your tooth."
statement_p: >-
  When decay, a crack or an old deep filling lets bacteria reach the nerve inside a tooth, the tissue becomes inflamed
  or infected. This can cause toothache, sensitivity to hot or cold, or swelling, though sometimes there are no symptoms
  at all. Root canal treatment cleans out the inside of the tooth and seals it, which usually lets you keep your own
  tooth instead of having it removed. Because a root-treated tooth is more brittle, we plan how it will be protected,
  usually with a crown, before treatment begins.
