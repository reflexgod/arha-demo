sections:
  - label: about
    heading: "What is root canal treatment?"
    body: |
      <p>Inside every tooth is soft tissue, the pulp, which runs through narrow channels in the roots called canals. In
      root canal treatment, the infected or inflamed pulp is removed, the canals are cleaned and shaped, and then they
      are filled and sealed to stop bacteria getting back in.</p>
  - label: benefits
    heading: "Why we recommend saving the tooth"
    body: |
      <ul>
        <li>You keep your own tooth, which usually works and feels better than a replacement.</li>
        <li>Treatment removes the source of infection, which relieves toothache in most cases.</li>
        <li>It avoids the gap, and the cost of replacing a tooth, that an extraction would leave.</li>
      </ul>
  - label: who is it for?
    heading: "Am I a candidate for root canal treatment?"
    body: |
      <p>Signs include toothache that lingers or wakes you at night, pain when biting, sensitivity to hot or cold that
      lasts after the drink has gone, a darkened tooth, or swelling of the gum. Only an examination and an X-ray can
      tell whether a tooth needs root canal treatment, or whether a filling is enough. If you have swelling or severe
      pain, call us the same day.</p>
  - label: process
    heading: "Explaining root canal treatment"
    body: |
      <p>Many root canal treatments are finished in one or two visits. Infected or complex teeth can need more, with
      a dressing placed in the tooth between visits. [[TBC: Arha's usual number of visits]]</p>
      <ol>
        <li><strong>Diagnosis.</strong> Examination and an X-ray of the tooth.</li>
        <li><strong>Cleaning.</strong> The tooth is numbed, the pulp removed and the canals cleaned and shaped.</li>
        <li><strong>Sealing.</strong> The canals are filled and sealed, and the tooth is closed with a filling.</li>
        <li><strong>Protecting.</strong> Usually a crown, fitted once the tooth has settled.</li>
      </ol>
  - label: aftercare
    heading: "Caring for your tooth afterwards"
    body: |
      <p>The tooth may feel tender for a few days, especially when biting; this usually settles on its own. Avoid
      chewing hard food on that side until the tooth has its permanent filling or crown. Then care for it like your other
      teeth, with brushing, cleaning between the teeth and regular check-ups.</p>
  - label: related treatments
    heading: "Crowns after root canal treatment"
    body: |
      <p>Back teeth in particular are protected with a crown after root canal treatment. Read about
      <a href="/treatments/crowns-bridges-full-mouth-rehabilitation/">crowns and bridges</a>, or, if a tooth cannot be
      saved, about <a href="/treatments/dental-implants/">dental implants</a>.</p>
  - label: faqs
    heading: "Find answers to popular root canal questions below"
    faqs:
      - q: "Is root canal treatment painful?"
        a: "The tooth is numbed with local anaesthetic before we start, so most people feel pressure rather than pain during treatment. It is often the toothache before treatment that hurts; some tenderness for a few days afterwards is common."
      - q: "Is a root canal better than an extraction?"
        a: "Keeping your own tooth is usually the better choice when it can be saved. If it cannot, we explain the ways to replace it."
      - q: "What does root canal treatment cost?"
        a: "The cost depends on the tooth (front teeth have fewer canals than molars) and whether a crown is needed. You receive an estimate after the examination."
      - q: "Can a root canal be redone?"
        a: "Yes. A tooth whose earlier root canal treatment has failed can often be treated again. We assess it with an X-ray first."
