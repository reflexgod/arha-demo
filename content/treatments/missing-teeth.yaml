sections:
  - label: about
    heading: "What are the options for missing teeth?"
    body: |
      <h4>Dental implant</h4>
      <p>A titanium post in the jaw holds a crown. It stands on its own, so the neighbouring teeth are not touched.
      It needs enough healthy bone and a healing period of some months before the final tooth is fitted.</p>
      <h4>Bridge</h4>
      <p>A false tooth is held by crowns on the teeth either side of the gap. It is fixed and usually quicker than an
      implant, but the supporting teeth are shaped to take the crowns.</p>
      <h4>Denture</h4>
      <p>A removable plate with one or more teeth. It is the least invasive and usually the least costly, and it can
      replace many teeth at once, but it feels less like your own teeth and comes out for cleaning.</p>
  - label: benefits
    heading: "Why we recommend replacing a missing tooth"
    body: |
      <ul>
        <li>It keeps the neighbouring and opposite teeth from moving out of position.</li>
        <li>It spreads the load of chewing evenly, protecting your other teeth.</li>
        <li>It restores your smile and, for front teeth, the way you speak.</li>
      </ul>
  - label: who is it for?
    heading: "Which option am I a candidate for?"
    body: |
      <ul>
        <li><strong>An implant</strong> often suits a single missing tooth with healthy teeth either side, when the bone
        and your general health allow.</li>
        <li><strong>A bridge</strong> can suit a gap next to teeth that already need crowns.</li>
        <li><strong>A denture</strong> can suit several missing teeth, or people who prefer to avoid surgery.</li>
      </ul>
      <p>Smoking, uncontrolled diabetes and gum disease affect every option, so we check these first.</p>
  - label: process
    heading: "Explaining your consultation"
    body: |
      <ol>
        <li><strong>Examination.</strong> We look at the gap, the teeth either side, your gums and your bite.</li>
        <li><strong>X-rays.</strong> To check the bone and the roots of the neighbouring teeth.</li>
        <li><strong>Options and estimate.</strong> We explain what each option involves, how long it takes, and its cost.</li>
        <li><strong>Your decision.</strong> You take the time you need; nothing starts until you are ready.</li>
      </ol>
  - label: aftercare
    heading: "Caring for your replacement tooth"
    body: |
      <p>Implants and bridges are cleaned like natural teeth, with extra care at the gum line: we show you how to clean
      under a bridge and around an implant with floss threaders or small brushes. Dentures come out every day for
      cleaning. Whatever you choose, regular check-ups help it last.</p>
  - label: related treatments
    heading: "Read more about each option"
    body: |
      <p>See <a href="/treatments/dental-implants/">dental implants</a>,
      <a href="/treatments/crowns-bridges-full-mouth-rehabilitation/">crowns and bridges</a> and
      <a href="/treatments/dentures/">dentures</a>.</p>
  - label: faqs
    heading: "Find answers to popular questions about missing teeth"
    faqs:
      - q: "Is an implant better than a bridge?"
        a: "Neither is better for everyone. An implant leaves the neighbouring teeth untouched; a bridge is quicker and needs no surgery. We recommend what suits your teeth after an examination."
      - q: "How soon after an extraction can a tooth be replaced?"
        a: "It depends on the option and on how the area heals. Sometimes a temporary tooth can be fitted straight away; implants usually wait for some healing. We plan the timing with you."
      - q: "What if I leave the gap?"
        a: "Some gaps, especially at the very back, cause few problems. Others let teeth tip and drift, which can affect your bite. We explain what is likely in your case."
      - q: "How soon after an extraction can a tooth be replaced?"
        a: "It depends on the option you choose and how the area heals. A temporary replacement can often be made in the meantime. We explain the timing at your consultation."
