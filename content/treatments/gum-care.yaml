description: "Bleeding or swollen gums? Gum care on Peddar Road, Mumbai: check-ups, scaling, deep cleaning and advice to keep gum disease under control."
h1: "Gum care and bleeding gums treatment"
answer: >-
  Bleeding, swollen or receding gums are usually signs of gum disease, caused by plaque at the gum line. Early gum
  disease can be reversed with professional cleaning and better brushing; more advanced disease needs deep cleaning and
  regular follow-up to keep it under control.
hero: hero-gum-care
statement_h2: "Gum care in South Mumbai: the foundation for every tooth, crown and implant."
statement_p: >-
  Gum disease is very common and often causes no pain, so many people don't notice it until the gums bleed when they brush,
  the teeth feel loose or the gums start to shrink back. Left alone, it can destroy the bone that holds the teeth. The
  good news is that it can usually be controlled. We measure your gums, explain what we find and clean the teeth
  thoroughly, above and below the gum line, then show you the cleaning routine that keeps them healthy.
