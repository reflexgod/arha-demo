sections:
  - label: about
    heading: "What is gum disease?"
    body: |
      <p>Plaque, a sticky film of bacteria, builds up where the teeth meet the gums. The gums react by becoming red,
      swollen and prone to bleeding: this is <strong>gingivitis</strong>, and it is reversible. If plaque and hardened
      tartar stay in place, the inflammation can spread to the bone around the teeth. This is
      <strong>periodontitis</strong>, which can lead to receding gums, loose teeth and, eventually, tooth loss.</p>
  - label: benefits
    heading: "Why we recommend treating your gums"
    body: |
      <ul>
        <li>Treatment stops bleeding and bad breath caused by gum disease.</li>
        <li>It protects the bone that holds your teeth, crowns and implants.</li>
        <li>Healthy gums are needed before crowns, bridges, implants or cosmetic treatment.</li>
      </ul>
  - label: who is it for?
    heading: "Do my gums need treatment?"
    body: |
      <ul>
        <li>Gums that bleed when you brush or floss.</li>
        <li>Red, swollen or tender gums.</li>
        <li>Bad breath or a bad taste that doesn't go away.</li>
        <li>Gums shrinking back, or teeth that look longer or feel loose.</li>
      </ul>
      <p>Smokers and people with diabetes are at higher risk and should have their gums checked regularly.</p>
  - label: process
    heading: "Explaining gum treatment"
    body: |
      <ol>
        <li><strong>Assessment.</strong> We measure the space between gum and tooth around each tooth and take X-rays.</li>
        <li><strong>Cleaning.</strong> A scale and polish for early disease; deep cleaning below the gum line, with local
        anaesthetic, for deeper pockets.</li>
        <li><strong>Home care.</strong> We show you how to brush and clean between your teeth effectively.</li>
        <li><strong>Review.</strong> We re-measure after a few weeks and agree how often you need cleaning.</li>
      </ol>
  - label: aftercare
    heading: "Caring for your gums afterwards"
    body: |
      <p>Brush twice a day for two minutes with a fluoride toothpaste, and clean between your teeth every day with floss
      or small interdental brushes. Stop smoking if you can. Gum disease can return, so keep to the cleaning visits we
      recommend. [[TBC: Arha's usual maintenance interval]]</p>
  - label: related treatments
    heading: "Gums, implants and other treatment"
    body: |
      <p>Implants need healthy gums too: see <a href="/treatments/dental-implants/">dental implants</a>. Read about
      <a href="/treatments/missing-teeth/">replacing teeth</a> lost to gum disease.</p>
  - label: faqs
    heading: "Find answers to popular gum care questions below"
    faqs:
      - q: "Why do my gums bleed when I brush?"
        a: "Bleeding is usually a sign of inflammation from plaque at the gum line. Keep brushing gently and book a check-up; bleeding that is ignored can lead to gum disease."
      - q: "Is deep cleaning painful?"
        a: "Deep cleaning is done with local anaesthetic where needed, so most people feel little during treatment. The gums can be tender for a few days afterwards."
      - q: "Can gum disease be cured?"
        a: "Gingivitis can be reversed. Periodontitis can't be fully reversed, but it can usually be controlled with treatment and regular cleaning, so you keep your teeth."
      - q: "Can gum disease be cured?"
        a: "Early gum disease (gingivitis) can usually be reversed with professional cleaning and careful brushing and cleaning between the teeth at home. More advanced gum disease (periodontitis) can be controlled, with regular reviews and cleaning to keep it stable."
