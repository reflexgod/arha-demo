title: "International and NRI Dental Patients | Arha Dental Care"
description: "Planning dental treatment in Mumbai from the UK, UAE, US or elsewhere? Plan your visits, share X-rays before you fly and know your aftercare."
h1: "Dental treatment in Mumbai, planned around your trip."
sub: "For patients flying in from the UK, UAE, US and beyond: your plan, your visits and your aftercare, explained before you book a flight."
whatsapp_text: "Hello Arha Dental Care, I live abroad and I'd like to plan dental treatment during a visit to Mumbai."

how:
  heading: "How it works"
  steps:
    - {h: "Tell us what you need", p: "Use the trip planner below, or send us a WhatsApp message with your dates."}
    - {h: "Share your X-rays", p: "Upload recent X-rays, scans or photos securely, so the dentist can look before you travel."}
    - {h: "Talk it through", p: "A video consultation to discuss your options and a sample visit plan. [[TBC: video consultation availability and how it's booked]]"}
    - {h: "Visit and follow up", p: "Your appointments are booked around your dates, with clear aftercare for when you fly home."}

