area:
  heading: "Getting to Peddar Road"
  intro: "Arha Dental Care is at 107 Doctor House, 14 Peddar Road, in South Mumbai. These are rough guides only. We don't recommend hotels or travel companies."
  items:
    - {h: "From Mumbai airport (CSMIA)", p: "[[TBC: approximate distance and usual travel time by road]]"}
    - {h: "Nearby areas", p: "Kemps Corner, Breach Candy, Cumballa Hill and Malabar Hill are close by. [[TBC: distances]]"}
    - {h: "Getting around", p: "Taxis and app-based cabs are the simplest way to reach us. [[TBC: parking and drop-off at Doctor House]]"}

practical:
  heading: "Practical information"
  items:
    - {h: "Visas and documents", p: "Visa rules depend on your passport and the reason for your visit. Check the official Government of India visa website before you book. We can provide an appointment letter if you need one. [[TBC: whether the clinic issues appointment letters]]"}
    - {h: "Flying after treatment", p: "Some treatments, such as implant surgery or extractions, need a few days before flying. Your dentist will tell you how long to allow. [[TBC: Arha's advice on flying after surgery]]"}
    - {h: "Medicines and health", p: "Bring a list of your medicines and any medical letters. Tell us about blood thinners, diabetes, heart conditions or bone medicines before treatment is planned."}
    - {h: "Travel insurance", p: "Check what your travel insurance covers. Many policies don't cover planned treatment abroad."}
    - {h: "Records to take home", p: "You leave with a summary of the treatment done and copies of your X-rays, for your home dentist. [[TBC: what records the clinic provides]]"}
    - {h: "If something feels wrong after you fly home", p: "Message us on WhatsApp with a photo and a description. For severe pain, swelling or bleeding, see a local dentist or doctor straight away."}

faq_heading: "Questions international patients ask"
faqs:
  - q: "Can I have dental implants during one visit to Mumbai?"
    a: "Implant treatment usually needs two trips: one to place the implant and one, after healing, for the final tooth. The healing time depends on your bone and your health. [[TBC: Arha's typical healing time]]"
  - q: "Can the dentist look at my X-rays before I travel?"
    a: "Yes. Upload recent X-rays, scans or photos through the secure form on this page and the dentist will look before your consultation. A full plan is confirmed only after an examination."
  - q: "Do you offer video consultations?"
    a: "[[TBC: whether video consultations are offered, and how they are booked]]"
  - q: "How long should I plan to stay?"
    a: "It depends on the treatment. Use the trip planner above for a sample timeline, then we confirm your exact plan after a consultation."
  - q: "What happens if I need help after I go home?"
    a: "Message us on WhatsApp. We can advise you, and talk to your home dentist if needed. For severe pain, swelling or bleeding, see a local dentist or doctor straight away."
  - q: "Do you treat children visiting with their parents?"
    a: "Yes, we see children for check-ups and treatment. Let us know their ages when you plan your visit."
