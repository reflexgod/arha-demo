# Image and video slots for v5. tools/v5_media.py crops each source to the slot's ratio around the focus point
# (fx, fy = 0..1), applies the stock grade to stock, and writes static/img/<name>-<w>.{avif,webp,jpg}.
# kind: real = Arha's own clinic photo/video (never replaced) | stock = licensed stock (credits in notes/image-credits.md).
# Stock people are never presented as Arha's patients, doctors or staff.

images:
  # ---- Home
  - {name: home-card-fmr, kind: stock, src: src-assets/stock/people/couple-on-sofa.jpg, ratio: [624, 400], focus: [0.5, 0.45], widths: [480, 800, 1248], alt: "Older couple smiling together"}
  - {name: home-card-rct, kind: stock, src: src-assets/stock/people/man-relaxed-smiling.jpg, ratio: [624, 400], focus: [0.5, 0.5], widths: [480, 800, 1248], alt: "Young man in a turban smiling"}
  - {name: home-card-kids, kind: stock, src: src-assets/stock/people/mother-daughter-laughing.jpg, ratio: [624, 400], focus: [0.55, 0.45], widths: [480, 800, 1248], alt: "Mother and daughter laughing together"}
  - {name: home-commitment, kind: real, src: assets/img/arha-dental-care-reception-south-mumbai-dental-clinic-02-1920.jpg, ratio: [720, 600], focus: [0.5, 0.5], widths: [480, 800, 1440], alt: "Reception and waiting area at Arha Dental Care, Peddar Road"}
  # ---- Treatment heroes (full width) and sidebar cards
  - {name: hero-implants, kind: stock, src: src-assets/stock/people/smile-side.jpg, flip: true, extend_right: 0.4, ratio: [1440, 770], focus: [0.0, 0.5], widths: [640, 1080, 1440, 1920], alt: "Close-up of a natural smile"}
  - {name: hero-fmr, kind: stock, src: src-assets/stock/people/grandmother-baby.jpg, flip: true, zoom: 1.15, ratio: [1440, 770], focus: [1.0, 0.3], widths: [640, 1080, 1440, 1920], alt: "Grandmother smiling at a baby"}
  - {name: hero-rct, kind: stock, src: src-assets/stock/portrait-1.jpg, zoom: 1.2, ratio: [1440, 770], focus: [1.0, 0.35], widths: [640, 1080, 1440, 1920], alt: "Young man laughing"}
  - {name: hero-kids, kind: stock, src: src-assets/stock/people/girl-smiling.jpg, flip: true, zoom: 1.25, ratio: [1440, 770], focus: [0.85, 0.62], widths: [640, 1080, 1440, 1920], alt: "Young girl smiling"}
  - {name: cta-implants, kind: stock, src: src-assets/stock/people/grandparents-grandchild.jpg, ratio: [3, 5], focus: [0.5, 0.35], widths: [400, 780], alt: "Grandparents smiling with their grandchild"}
  - {name: cta-fmr, kind: stock, src: src-assets/stock/people/grandfather-grandson.jpg, ratio: [3, 5], focus: [0.74, 0.4], widths: [400, 780], alt: "Older man smiling"}
  - {name: cta-rct, kind: stock, src: src-assets/stock/people/young-woman-smiling.jpg, ratio: [3, 5], focus: [0.5, 0.35], widths: [400, 780], alt: "Young woman smiling"}
  - {name: cta-kids, kind: stock, src: src-assets/stock/people/mother-daughter-portrait.jpg, ratio: [3, 5], focus: [0.5, 0.45], widths: [400, 780], alt: "Mother and daughter smiling"}
  # ---- The practice
  - {name: practice-hero, kind: real, src: assets/img/arha-dental-care-reception-south-mumbai-dental-clinic-01-1920.jpg, ratio: [720, 740], focus: [0.62, 0.5], widths: [480, 800, 1440], alt: "The Arha Dental Care logo on the marble wall behind reception"}
  - {name: practice-story, kind: real, src: assets/img/arha-dental-care-exterior-dental-clinic-peddar-road-1920.jpg, ratio: [616, 659], focus: [0.5, 0.5], widths: [480, 800, 1232], alt: "Arha Dental Care sign at 107 Doctor House, with the names of Dr. Vasant P. Jain and Dr. Nikhil V. Jain"}
  # ---- Contact
  - {name: contact-photo, kind: real, src: src-assets/dental-operatory-arha-dental-care-peddar-road-04.jpeg, ratio: [616, 552], focus: [0.42, 0.55], widths: [480, 800, 1232], alt: "Consultation desk in a treatment room at Arha Dental Care"}

videos:
  - {name: home-hero-tour, kind: real, src: src-assets/hero-land-master.mp4, start: 0, duration: 12.7, crop: [1152, 1080], focus: [0.3, 0.5], sizes: [[768, 720], [1152, 1080]], poster_widths: [768, 1152]}
  - {name: home-card-walkthrough, kind: real, src: src-assets/IMG_2303.MOV, start: 26, duration: 14, crop: [1080, 608], focus: [0.5, 0.42], sizes: [[640, 360], [1080, 608]], poster_widths: [640, 1080]}
