videos:
  # Home: first treatment card, click-to-play, muted. Arha's own footage (IMG_2303, walk-through filmed in the clinic):
  # 31-39.4 s = treatment chair and unit, then the wall screen showing a digital dental scan; 16:9 band from the
  # portrait frame. Replace with a landscape film of Dr Nikhil at work when the clinic shoots one.
  # (The earlier stock clip, Mixkit 12140, is retired; see notes/image-credits.md.)
  - {name: home-film, kind: real, src: src-assets/IMG_2303.MOV, start: 31, duration: 8.4, crop: [1080, 608], focus: [0.5, 0.5], crf: 26, grade: "eq=contrast=1.03:saturation=1.02", sizes: [[1080, 608]], poster_widths: [640, 960, 1080], alt: "A treatment room at Arha Dental Care, Peddar Road, with the dental chair and a screen showing a digital dental scan"}
  # Practice page: the full 1 min 24 s walk-through (IMG_2303), click-to-play, muted (the soundtrack is room noise only).
  - {name: practice-tour, kind: real, src: src-assets/IMG_2303.MOV, start: 0, duration: 84, poster_at: 24, crop: [1080, 1920], focus: [0.5, 0.5], crf: 28, grade: "eq=contrast=1.03:saturation=1.02", sizes: [[720, 1280]], poster_widths: [360, 720], alt: "A walk through Arha Dental Care, from reception to the treatment rooms"}
