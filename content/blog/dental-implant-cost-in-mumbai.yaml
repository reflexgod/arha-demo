lead: >-
  "How much does an implant cost?" is one of the first questions people ask, and a fair one. The trouble with a single
  number is that implant treatment is not one product. The cost depends on what your mouth needs, and two quotes that
  look different are often describing different treatment.
body: |
  <h2>Why is there no single price for a dental implant?</h2>
  <p>"An implant" usually means three parts: the implant itself, which sits in the bone; a connector called an
  abutment; and the tooth on top, usually a crown. Around those parts sit the scans, the planning, any preparation the
  site needs, the temporary teeth and the follow-up visits. Every one of these varies from person to person.</p>
  <p>That is why we don't publish one figure for implants. A number given without an examination would either be too
  low for many people or too high for others. Instead, you receive a written estimate after your consultation,
  itemised so you can see what each part covers.
  [[TBC: whether Arha publishes any fees]]</p>

  <h2>What affects the cost of implant treatment?</h2>
  <h3>How many teeth are being replaced</h3>
  <p>One implant replacing one tooth is the simplest case. Several missing teeth can sometimes be replaced with fewer
  implants holding a bridge, and a whole arch can be replaced with a fixed bridge or a denture held by implants. The
  number of implants and the type of teeth on top change the cost considerably.</p>
  <h3>The bone and gums</h3>
  <p>If the bone is too thin or too low, it may need building up with a bone graft or a sinus lift before or during
  implant placement. Gum disease needs treating first. These steps add time and cost, and your scans show whether you
  need them.</p>
  <h3>Extractions and temporary teeth</h3>
  <p>If a damaged tooth has to come out first, that is part of the treatment. So is a temporary tooth for the healing
  stage, especially at the front of the mouth.</p>
  <h3>The scans and planning</h3>
  <p>A 3D scan of the jaw shows the height, width and quality of the bone, and the position of nerves and sinuses.
  Careful planning from the scan helps place the implant where the final tooth needs it.</p>
  <h3>The implant system and components</h3>
  <p>Implants and their parts are made by many manufacturers. Systems differ in their research history, the range of
  parts available, and how easily parts can be sourced years later if a crown needs replacing. Ask which system is
  proposed and why.</p>
  <h3>The final tooth or teeth</h3>
  <p>Crowns, bridges and implant-held dentures can be made in different materials, such as zirconia or porcelain fused
  to metal. The choice depends on where the tooth is, how strongly you bite and how it needs to look.</p>

  <h2>What should a written implant estimate include?</h2>
  <p>When you compare quotes, check whether each one includes:</p>
  <ul>
    <li>The consultation, X-rays and 3D scan.</li>
    <li>Any extractions, gum treatment or bone grafting.</li>
    <li>The implant, the abutment and the final crown, bridge or denture, and the materials used.</li>
    <li>Temporary teeth during healing.</li>
    <li>Follow-up and review visits, and what happens if an adjustment is needed.</li>
    <li>The number of visits and the expected timeline.</li>
  </ul>
  <p>A lower figure that leaves out the crown, the scan or the grafting is not cheaper treatment; it is a smaller part
  of the same treatment. An itemised estimate makes these differences visible.</p>

  <h2>What questions should I ask before I decide?</h2>
  <ul>
    <li>Who plans the treatment, and who places the implant and makes the final tooth?</li>
    <li>Which implant system will be used?</li>
    <li>Do I need bone grafting, and is it included?</li>
    <li>What happens during healing: will I have a temporary tooth?</li>
    <li>How should I look after the implant, and how often will you review it?</li>
    <li>What are the alternatives, such as a bridge or a denture, and how do they compare for my mouth?</li>
  </ul>
  <p>A good clinic welcomes these questions. Our article on <a href="/blog/dental-implant-vs-bridge/">choosing between
  an implant and a bridge</a> covers the main alternative in more detail.</p>

  <h2>Does the type of dentist matter?</h2>
  <p>Implant treatment is both surgery and restoration: the implant has to be placed well, and the tooth on top has to
  fit your bite and be easy to clean. At Arha, implant treatment is planned by Dr. Nikhil V. Jain, a prosthodontist,
  the dental specialty that restores and replaces teeth. The plan starts from the final tooth, and the implant is placed
  to support it. Whichever clinic you choose, ask who is responsible for each stage.</p>

  <h2>Are there ways to spread the cost?</h2>
  <p>Implant treatment happens in stages over several months, so the cost is usually spread across those stages rather
  than paid at once. Ask how payments are arranged at your consultation.
  [[TBC: payment methods and any EMI option Arha offers || Ask us about payment options when you plan your treatment.]]</p>
  <p>Dental treatment is often excluded from health insurance policies, apart from some accident cover, so check your
  own policy wording before you rely on it.</p>

  <h2>Is the cheapest option the right one?</h2>
  <p>An implant is meant to last many years with good care, so it is worth judging on more than the first figure you
  see. The right plan is the one that suits your mouth, is explained clearly, and that you understand and agree with
  before treatment starts. Sometimes that is not an implant at all.</p>
  <p>See our <a href="/treatments/dental-implants/">dental implants</a> page and our
  <a href="/for-patients/#fee-guide">fee guide</a>, or <a href="/contact/?treatment=dental-implants#book">book a
  consultation</a> to receive a written estimate for your own treatment.</p>
faqs:
  - q: "Can you tell me the cost of an implant over the phone?"
    a: "Not accurately. The cost depends on the bone, the gums, any extractions or grafting, and the type of tooth on top, which can only be judged after an examination and scans. You receive an itemised written estimate after your consultation."
  - q: "Why do implant quotes in Mumbai vary so much?"
    a: "Quotes often cover different things. Some include the scan, the abutment, the crown, temporary teeth and follow-up visits; others list only the implant. Compare itemised estimates line by line."
  - q: "Is an implant more expensive than a bridge or a denture?"
    a: "At the start, an implant usually costs more than a denture and is often comparable to or more than a bridge. Each option has different long-term needs. We explain the options for your mouth so you can weigh them up."
  - q: "Does health insurance cover dental implants?"
    a: "Dental treatment is often excluded from health insurance policies, apart from some accident cover. Check your own policy wording, and ask your insurer before treatment if you plan to claim."
