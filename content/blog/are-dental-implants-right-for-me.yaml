h1: "Are dental implants right for me?"
excerpt: "Most adults with missing teeth can be considered. These are the things that decide whether an implant suits you."
lead: >-
  Dental implants can replace one tooth, several, or a whole arch. Most adults who have lost teeth can be considered,
  but an implant is not the right choice for everyone. These are the things a dentist looks at.
body: |
  <h2>Implants often suit people who</h2>
  <ul>
    <li>Have lost one or more teeth through decay, gum disease or an injury.</li>
    <li>Would rather not have the teeth beside a gap shaped for a bridge.</li>
    <li>Find a removable denture loose or uncomfortable.</li>
    <li>Have healthy gums, or are willing to have gum treatment first.</li>
  </ul>
  <h2>What can affect whether you can have an implant</h2>
  <h3>Bone</h3>
  <p>An implant needs enough bone to hold it. Bone shrinks after a tooth is lost, so the longer a gap has been there,
  the more likely it is that bone needs building up first. X-rays or a 3D scan show this.</p>
  <h3>Gum health</h3>
  <p>Active gum disease needs treating before an implant is placed, and keeping the gums healthy afterwards is what
  protects the implant over time.</p>
  <h3>General health and medicines</h3>
  <p>Conditions such as uncontrolled diabetes, and some medicines, including some used for bone conditions, can affect
  healing. Always tell the dentist about your health and the medicines you take.</p>
  <h3>Smoking</h3>
  <p>Smoking slows healing and raises the risk of problems around implants. Cutting down or stopping helps.</p>
  <h3>Age</h3>
  <p>Implants are placed once the jaw has stopped growing, so they are not usually used for children. There is no
  upper age limit: general health matters more than age.</p>
  <h2>Questions to ask at your consultation</h2>
  <ul>
    <li>Is an implant the right option for me, and what are the alternatives?</li>
    <li>Will I need bone grafting or any treatment first?</li>
    <li>How long will the whole treatment take, and how many visits?</li>
    <li>What will I wear while the implant heals?</li>
    <li>What is the total cost, including the crown?</li>
    <li>How should I look after it, and how often will you review it?</li>
  </ul>
  <p>The only way to know for certain is an examination. At Arha, implant consultations are with Dr. Nikhil V. Jain, a
  prosthodontist, who explains your options and gives you a written plan. Read about the
  <a href="/blog/dental-implant-timeline/">implant timeline</a>, or <a href="/contact/?treatment=dental-implants#book">book
  a consultation</a>.</p>
reviewer: "[[TBC: reviewed by Dr. Nikhil V. Jain, MDS (Prosthodontics)]]"
