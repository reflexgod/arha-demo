lead: >-
  Dental implants can replace one tooth, several, or a whole arch. Most adults who have lost teeth can be considered,
  but an implant is not the right choice for everyone, and being a good candidate is about more than having a gap. This
  guide explains who implants usually suit, the things a dentist checks before recommending one, and what the
  alternatives are if an implant isn't right for you.
body: |
  <h2>Who are dental implants usually suitable for?</h2>
  <p>Implants often suit adults who:</p>
  <ul>
    <li>Have lost one or more teeth through decay, gum disease or an injury.</li>
    <li>Would rather not have the teeth beside a gap shaped for a bridge.</li>
    <li>Find a removable denture loose or uncomfortable, and want something more secure.</li>
    <li>Have healthy gums, or are willing to have gum treatment first.</li>
    <li>Are able to keep the area clean every day and come back for regular reviews.</li>
  </ul>
  <p>None of these alone decides it. What matters is the combination of your bone, your gums, your general health and
  what you want from treatment.</p>

  <h2>What does a dentist check before recommending an implant?</h2>
  <p>Before any treatment, the dentist examines your mouth and talks through your medical history. Usually this
  includes:</p>
  <ul>
    <li>The gap itself, the teeth on either side, and the tooth it bites against.</li>
    <li>The health of your gums, and any signs of gum disease elsewhere in the mouth.</li>
    <li>X-rays or a 3D scan to see the height and width of the bone, and the position of nerves and sinuses.</li>
    <li>Your bite, and whether you grind or clench your teeth.</li>
    <li>Your general health, the medicines you take, and whether you smoke.</li>
  </ul>
  <p>From this, you receive a plan that sets out whether an implant suits you, what would need to happen first, and the
  alternatives.</p>

  <h2>Do I have enough bone for an implant?</h2>
  <p>An implant needs enough bone to hold it firmly. After a tooth is lost, the bone in that area gradually shrinks
  because it is no longer being used, so the longer a gap has been there, the more likely it is that bone needs
  building up. In the upper back jaw, the sinus can also sit close to where the implant needs to go.</p>
  <p>Bone loss does not always rule implants out. A bone graft can add bone where it is thin, and a sinus lift can make
  room in the upper back jaw. Both add time to treatment.
  [[TBC: whether bone grafting and sinus lifts are done at Arha || We explain whether you need this, and what it involves, at your consultation.]]
  Our <a href="/treatments/dental-implants/">dental implants</a> page explains bone grafting and sinus lifts in more
  detail.</p>

  <h2>Can I have implants if I have gum disease?</h2>
  <p>Active gum disease needs treating before an implant is placed. The bacteria that inflame the gums around natural
  teeth can also inflame the gum and bone around an implant. Once the gums are healthy and you are keeping them that
  way, an implant can usually be considered. Keeping the gums healthy afterwards is what protects the implant over
  time. See our <a href="/treatments/gum-care/">gum care</a> page for how gum treatment works.</p>

  <h2>Can I have implants if I have diabetes or take regular medicines?</h2>
  <p>Often, yes, but your health affects how well the bone heals around an implant, so it is an important part of the
  assessment.</p>
  <ul>
    <li><strong>Diabetes.</strong> Well-controlled diabetes does not usually rule implants out. Uncontrolled diabetes
    slows healing and raises the risk of infection, so the dentist may suggest waiting until it is better
    controlled.</li>
    <li><strong>Medicines for bone conditions.</strong> Some medicines used for osteoporosis or cancer, such as
    bisphosphonates, can affect how the jawbone heals. Tell the dentist if you take them, or have taken them in the
    past.</li>
    <li><strong>Blood thinners.</strong> Don't stop a blood thinner on your own. The dentist plans around it and, if
    needed, speaks with your doctor.</li>
    <li><strong>Radiotherapy to the head or neck.</strong> This can affect the jawbone, so it needs careful assessment
    before any surgery in the mouth.</li>
  </ul>
  <p>Bring a list of your medicines and any recent reports to the consultation. A health condition does not always mean
  an implant is out of the question, but it can change the plan and the timeline.</p>

  <h2>Can smokers have dental implants?</h2>
  <p>Smokers can be considered, but smoking slows healing and raises the risk of problems around implants, both while
  the implant is settling and in the years after. Cutting down or stopping before treatment, and staying off cigarettes
  while the implant heals, gives it a better chance. The dentist will talk this through honestly with you.</p>

  <h2>Am I too old or too young for implants?</h2>
  <p>Implants are placed once the jaw has stopped growing, so they are not usually used for children or young
  teenagers. At the other end, there is no upper age limit: general health, bone and the ability to keep the area clean
  matter far more than age. Many older adults choose implants to hold a denture firmly in place.</p>

  <h2>What if I grind or clench my teeth?</h2>
  <p>Grinding puts heavy forces on teeth, crowns and implants alike. It doesn't rule implants out, but it changes how
  they are planned, and the dentist may suggest a night guard to protect the new tooth and your natural teeth.</p>

  <h2>What if an implant isn't right for me?</h2>
  <p>There are other good ways to replace teeth. A <a href="/blog/dental-implant-vs-bridge/">bridge</a> uses the teeth
  beside the gap for support and needs no surgery. A <a href="/treatments/dentures/">denture</a> can replace one tooth
  or many and comes out for cleaning. Sometimes an implant becomes possible later, once gum disease or a health
  condition is under control.</p>

  <h2>What should I ask at my implant consultation?</h2>
  <ul>
    <li>Is an implant the right option for me, and what are the alternatives?</li>
    <li>Will I need gum treatment, bone grafting or any other treatment first?</li>
    <li>How long will the whole treatment take, and how many visits?</li>
    <li>What will I wear while the implant heals?</li>
    <li>What is the total cost, including the crown?</li>
    <li>How should I look after it, and how often will you review it?</li>
  </ul>
  <p>The only way to know for certain is an examination. At Arha, implant consultations are with Dr. Nikhil V. Jain, a
  prosthodontist, who explains your options and gives you a written plan. Read about the
  <a href="/blog/dental-implant-timeline/">implant timeline</a> and <a href="/blog/dental-implant-cost-in-mumbai/">what
  decides the cost</a>, or <a href="/contact/?treatment=dental-implants#book">book a consultation</a>.</p>
faqs:
  - q: "Can I have an implant years after losing a tooth?"
    a: "Often, yes. The bone in the gap may have shrunk over the years, so a scan shows whether there is enough to hold an implant, or whether it needs building up first."
  - q: "I wear a denture now. Can I switch to implants?"
    a: "Many people can, either with implants that hold fixed teeth or with a few implants that hold a denture firmly in place. The bone and your health decide which options suit you."
  - q: "Do I need a 3D scan before an implant?"
    a: "A 3D scan shows the height and width of the bone, and the position of nerves and sinuses, which helps plan where the implant goes. The dentist explains which X-rays or scans you need for your case."
  - q: "Can a front tooth be replaced with an implant?"
    a: "Yes, often. At the front, the gum and bone around the gap matter a great deal for how natural the result looks, so they are assessed carefully before treatment."
