title: "Dental Implant Aftercare: The First Week and Beyond"
description: "How to look after a new dental implant: the first 24 hours, the first week, and the daily cleaning and check-ups that keep it healthy for years."
h1: "Looking after your dental implant: the first week and the years after"
excerpt: "What to expect after an implant is placed, and the simple habits that protect it over the long term."
related: [dental-implants, gum-care, missing-teeth]
lead: >-
  An implant can't decay, but the gum and bone around it can become inflamed if plaque is left behind. Good care in the
  first week helps it heal; good habits after that help it last.
body: |
  <h2>The first 24 hours</h2>
  <ul>
    <li>Bite gently on gauze if the area is oozing, as you were shown.</li>
    <li>Avoid hot drinks and food until the numbness wears off, so you don't burn or bite your cheek.</li>
    <li>Don't rinse hard or spit forcefully on the first day.</li>
    <li>Take painkillers you would normally use, following the packet, or as the dentist advised.</li>
    <li>Rest, and keep your head raised with an extra pillow at night.</li>
  </ul>
  <h2>The first week</h2>
  <ul>
    <li>Eat soft food and chew on the other side.</li>
    <li>From the second day, rinse gently with warm salt water after meals, unless you were told otherwise.</li>
    <li>Brush your other teeth as normal, and clean near the implant gently.</li>
    <li>Avoid smoking: it slows healing.</li>
  </ul>
  <h3>When to call us</h3>
  <p>Some swelling and tenderness for a few days is common. Call the clinic if you have bleeding that won't stop,
  swelling that is getting worse after the third day, a fever, or pain that painkillers don't help. If swelling affects
  your breathing or swallowing, go to a hospital emergency department straight away.</p>
  <h2>Every day, for the long term</h2>
  <ul>
    <li>Brush twice a day, including the gum line around the implant.</li>
    <li>Clean between the teeth once a day with floss or small interdental brushes.</li>
    <li>If you grind your teeth, ask about a night guard.</li>
    <li>Don't use your teeth to open packets or bite hard objects.</li>
  </ul>
  <h2>Check-ups and professional cleaning</h2>
  <p>Regular reviews let the dentist check the gum and bone around the implant, the fit of the crown and your bite, and
  clean areas that are hard to reach at home. [[TBC: Arha's recommended review interval after implant treatment]]</p>
  <p>These are general instructions. Always follow the written aftercare advice you are given after your own treatment.
  Read more on our <a href="/treatments/dental-implants/">dental implants</a> page.</p>
