title: "Dental Implant or Bridge: Which Is Right? | Arha Dental Care"
description: "A dental implant and a bridge can both replace a missing tooth. How they differ, what each involves, and the questions that help you choose."
h1: "Dental implant or bridge: how to choose the right replacement"
excerpt: "Both can replace a missing tooth well. The right choice depends on the teeth beside the gap, the bone and you."
lead: >-
  When one tooth is missing, the two fixed options are usually an implant or a bridge. Both can look natural and work
  well. They differ in how they are held in place, what they ask of the teeth around them, and what treatment involves.
body: |
  <h2>How an implant works</h2>
  <p>An implant is a small titanium post placed in the jawbone where the root used to be. Once the bone has bonded with
  it, a crown is fixed on top. The teeth either side of the gap are not involved.</p>
  <h2>How a bridge works</h2>
  <p>A conventional bridge replaces the missing tooth with a false tooth joined to crowns on the teeth either side. To
  fit those crowns, the neighbouring teeth are shaped. An adhesive bridge, bonded to the back of a neighbouring tooth,
  needs much less shaping, but suits fewer situations.</p>
  <h2>Comparing the two</h2>
  <h3>The neighbouring teeth</h3>
  <ul>
    <li><strong>Implant:</strong> the teeth beside the gap are left untouched.</li>
    <li><strong>Bridge:</strong> the teeth beside the gap are usually crowned. If they already have large fillings or
    crowns, this matters less.</li>
  </ul>
  <h3>Time</h3>
  <ul>
    <li><strong>Implant:</strong> usually a few months, because the bone needs time to bond with the implant.</li>
    <li><strong>Bridge:</strong> usually a few weeks, with no healing period in the bone.</li>
  </ul>
  <h3>Bone and gum</h3>
  <ul>
    <li><strong>Implant:</strong> needs enough healthy bone; some people need bone grafting first.</li>
    <li><strong>Bridge:</strong> does not need bone where the tooth is missing, but needs healthy supporting teeth.</li>
  </ul>
  <h3>Cleaning</h3>
  <ul>
    <li><strong>Implant:</strong> brushed and cleaned between like a natural tooth.</li>
    <li><strong>Bridge:</strong> needs cleaning underneath the false tooth with floss threaders or small brushes.</li>
  </ul>
  <h2>Questions that help you decide</h2>
  <ul>
    <li>Are the teeth beside the gap healthy and unrestored, or already heavily filled?</li>
    <li>Is there enough bone, and are the gums healthy?</li>
    <li>How soon do you want the gap filled?</li>
    <li>What does each option cost, in total, for your situation?</li>
  </ul>
  <p>There is no single right answer. At a consultation, the dentist examines the gap and the teeth around it, takes
  X-rays, and explains which options suit you, with the cost of each. A removable denture is a third option, covered on
  our <a href="/treatments/missing-teeth/">missing teeth</a> page.</p>
reviewer: "[[TBC: reviewed by Dr. Nikhil V. Jain, MDS (Prosthodontics)]]"
