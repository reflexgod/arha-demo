lead: >-
  When one tooth is missing, the two fixed options are usually an implant or a bridge. Both can look natural and work
  well for many years. They differ in how they are held in place, what they ask of the teeth around them, how long
  treatment takes and how you clean them. This guide sets out the pros and cons of each, so the conversation at your
  consultation is easier.
body: |
  <h2>What is the difference between an implant and a bridge?</h2>
  <p>An <strong>implant</strong> replaces the root of the missing tooth. A small post, usually titanium, is placed in the
  jawbone where the root used to be. Once the bone has bonded with it, a crown is fixed on top. The implant stands on
  its own, so the teeth either side of the gap are not involved.</p>
  <p>A <strong>bridge</strong> replaces only the visible part of the tooth. The false tooth is held in place by the teeth
  next to the gap. There are a few kinds:</p>
  <ul>
    <li><strong>Conventional bridge.</strong> The false tooth is joined to crowns on the teeth either side. To fit those
    crowns, the neighbouring teeth are shaped.</li>
    <li><strong>Adhesive bridge.</strong> The false tooth has a thin wing that is bonded to the back of a neighbouring
    tooth. It needs much less shaping, but it suits fewer situations, usually where the bite is light.</li>
  </ul>

  <h2>What are the pros and cons of a dental implant?</h2>
  <h3>Pros</h3>
  <ul>
    <li>The teeth beside the gap are left untouched.</li>
    <li>It is cleaned much like a natural tooth, with a brush and floss or small interdental brushes.</li>
    <li>It loads the bone where the tooth used to be, which helps keep that bone in place.</li>
  </ul>
  <h3>Cons</h3>
  <ul>
    <li>It involves a minor surgical procedure, under local anaesthetic.</li>
    <li>Treatment usually takes a few months, because the bone needs time to bond with the implant.</li>
    <li>It needs enough healthy bone. Some people need bone built up first, which adds time and cost.</li>
    <li>General health, some medicines and smoking can affect whether it is suitable.</li>
  </ul>

  <h2>What are the pros and cons of a bridge?</h2>
  <h3>Pros</h3>
  <ul>
    <li>There is no surgery and no healing period in the bone.</li>
    <li>It is usually finished in a few weeks.</li>
    <li>It does not depend on the amount of bone where the tooth is missing.</li>
    <li>If the teeth beside the gap already need crowns, a bridge can restore them and replace the missing tooth at
    the same time.</li>
  </ul>
  <h3>Cons</h3>
  <ul>
    <li>A conventional bridge means shaping the neighbouring teeth, which cannot be undone.</li>
    <li>The supporting teeth carry the extra load of the false tooth.</li>
    <li>Plaque can collect under the false tooth, so it needs cleaning with floss threaders or small brushes.</li>
    <li>If one supporting tooth develops decay or another problem, the whole bridge may need to be remade.</li>
    <li>Over time, the bone under the false tooth can shrink, which can leave a small gap under it.</li>
  </ul>

  <h2>Which is better when the teeth beside the gap already have crowns or fillings?</h2>
  <p>This is often the deciding question. If the neighbouring teeth are healthy and have never been filled, many people
  prefer not to shape them, and an implant protects them. If those teeth already have large fillings or crowns that
  will need replacing anyway, a bridge can be a sensible choice, because it restores them as part of the same
  treatment. The X-rays matter here too: a supporting tooth needs healthy roots and bone to carry a bridge.</p>

  <h2>What if several teeth are missing in a row?</h2>
  <p>When two or more neighbouring teeth are missing, the choice changes. A conventional bridge across a long gap puts a
  lot of load on the teeth at each end. One option is a bridge held by implants instead of natural teeth, so fewer
  implants support more replacement teeth. Another is a removable partial denture. Our
  <a href="/treatments/missing-teeth/">missing teeth</a> page compares implants, bridges and dentures side by side, and
  covers the options where a denture may suit you better.</p>

  <h2>Is an implant or a bridge better for a front tooth?</h2>
  <p>Either can look natural at the front of the mouth. What matters most is the gum and bone around the gap. An
  implant at the front needs enough bone to support the gum line, so it sits at the same height as the teeth beside it.
  A bridge can give a good result where the bone has shrunk, but the false tooth has to be shaped to hide the gum line.</p>

  <h2>How do the costs compare?</h2>
  <p>An implant usually costs more at the start than a bridge for the same gap, though this depends on how many teeth a
  bridge would involve and whether the implant needs bone grafting. The long-term picture also differs: a bridge
  depends on the health of its supporting teeth, and an implant depends on the health of the gum and bone around it.
  Our article on <a href="/blog/dental-implant-cost-in-mumbai/">dental implant cost in Mumbai</a> explains what goes
  into an implant estimate and how to compare quotes.</p>

  <h2>How do I decide between an implant and a bridge?</h2>
  <p>These questions help you and your dentist reach the right answer:</p>
  <ul>
    <li>Are the teeth beside the gap healthy and unrestored, or already heavily filled or crowned?</li>
    <li>Is there enough bone, and are the gums healthy?</li>
    <li>How soon do you want the gap filled?</li>
    <li>How do you feel about a minor surgical procedure?</li>
    <li>What does each option cost, in total, for your situation?</li>
  </ul>
  <p>There is no single right answer for everyone. At Arha, replacement teeth are planned by Dr. Nikhil V. Jain, a
  prosthodontist, the dental specialty that restores and replaces teeth. At a consultation he examines the gap and the
  teeth around it, takes X-rays, and explains which options suit you, with the cost and timeline of each in writing.
  If an implant is on the table, read <a href="/blog/are-dental-implants-right-for-me/">are dental implants right for
  me?</a> and <a href="/blog/dental-implant-timeline/">how long a dental implant takes</a>, or
  <a href="/contact/?treatment=missing-teeth#book">book a consultation</a>.</p>
faqs:
  - q: "Does a bridge damage the teeth either side?"
    a: "A conventional bridge needs the neighbouring teeth to be shaped for crowns, which removes some tooth structure and cannot be undone. An adhesive bridge needs much less shaping. If those teeth already have large fillings or crowns, the shaping matters less."
  - q: "Can a bridge be replaced with an implant later?"
    a: "Often, yes, if there is enough bone where the tooth is missing. Bone can shrink in the years after a tooth is lost, so some people need it built up first. X-rays or a scan show whether this is possible."
  - q: "Which lasts longer, an implant or a bridge?"
    a: "Both are long-term replacements, and both depend on cleaning at home and regular check-ups. A bridge depends on its supporting teeth staying healthy; an implant depends on the gum and bone around it. The crown on either may need attention over the years."
  - q: "Is a bridge an option if I can't have an implant?"
    a: "Usually, as long as the teeth beside the gap are healthy enough to support it. If they are not, a removable partial denture is another option. We explain which ones suit your mouth at your consultation."
