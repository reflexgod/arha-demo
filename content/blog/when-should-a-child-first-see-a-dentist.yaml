lead: >-
  Many parents wait until a child complains of toothache, or until the adult teeth arrive, before booking a dental
  visit. By then, a problem has often been building for a while. An early, easy first visit is one of the simplest
  things you can do for your child's teeth.
body: |
  <h2>What age should a child first see a dentist?</h2>
  <p>Children's dental organisations recommend a first visit when the first tooth appears, and no later than the
  first birthday. That can sound early, but the aim of that first visit is not treatment. It is a short check, advice
  for you, and a chance for your child to meet the dentist while nothing hurts.</p>
  <p>If your child is older and has never been, that's fine too. Book a visit now rather than waiting for a problem;
  it is never too late to start.</p>

  <h2>Why do baby teeth matter if they fall out anyway?</h2>
  <p>Baby teeth do far more than fill a gap until the adult teeth arrive:</p>
  <ul>
    <li>They help your child chew a full range of foods.</li>
    <li>They support clear speech as your child learns to talk.</li>
    <li>They hold space for the adult teeth. A baby tooth lost early to decay can let neighbouring teeth drift, which
    can crowd the adult teeth later.</li>
    <li>Decay in a baby tooth can become painful and infected, just like in an adult tooth.</li>
  </ul>
  <p>Some back baby teeth stay in place until around the age of ten to twelve, so they need to last for years.</p>

  <h2>What happens at a child's first dental visit?</h2>
  <p>The first visit is usually short and gentle. For a baby or toddler, the dentist may look at the teeth with your
  child sitting on your lap. For an older child, the chair itself is often part of the fun. The dentist will:</p>
  <ul>
    <li>Look at the teeth, gums and bite.</li>
    <li>Check for early signs of decay, such as chalky white or brown patches.</li>
    <li>Ask about feeding, snacks, drinks, brushing and habits such as thumb sucking or a dummy.</li>
    <li>Show you how to brush your child's teeth, and how much toothpaste to use.</li>
    <li>Suggest when to come back.</li>
  </ul>
  <p>X-rays are not usually needed at a first visit, and nothing is done without explaining it to you first.
  [[TBC: who sees children at Arha || Ask us when you book who will see your child.]]</p>

  <h2>How can I prepare my child for the visit?</h2>
  <ul>
    <li><strong>Keep the language simple and positive.</strong> "The dentist will count your teeth" works better than
    "it won't hurt", which plants the idea that it might.</li>
    <li><strong>Read a picture book or play "dentist"</strong> at home, counting each other's teeth with a toothbrush.</li>
    <li><strong>Book a time when your child is usually rested</strong>, not just before a nap or a meal.</li>
    <li><strong>Bring them along to a parent's check-up</strong> first, if you can, so the clinic feels familiar.</li>
    <li><strong>Stay calm yourself.</strong> Children pick up on worry. If you are anxious about dentists, it's fine
    to tell us; we can help.</li>
  </ul>
  <p>[[TBC: Parents are welcome to stay with their child (confirm before this line goes live)]]</p>

  <h2>How should I look after my child's teeth at home?</h2>
  <h3>Brushing</h3>
  <ul>
    <li>Start brushing as soon as the first tooth appears, twice a day: last thing at night and one other time.</li>
    <li>Use a soft, small-headed brush and a fluoride toothpaste. Commonly advised amounts are a smear, about the size
    of a grain of rice, for children under three, and a pea-sized amount from three to six. We confirm what suits your
    child at the visit.</li>
    <li>Encourage your child to spit out the excess rather than rinse, so the fluoride stays on the teeth.</li>
    <li>Brush for them, or help them, until they can do it well themselves, often around seven or eight years old.</li>
  </ul>
  <h3>Food and drink</h3>
  <ul>
    <li>How often sugar reaches the teeth matters as much as how much. Keep sweets, juices and sweetened milk to
    mealtimes rather than spread through the day.</li>
    <li>Water and plain milk are the kindest drinks for teeth between meals.</li>
    <li>Avoid putting a baby to sleep with a bottle of milk or juice, as it bathes the teeth in sugar for hours.</li>
    <li>Sticky snacks such as biscuits, chikki and dried fruit cling to the teeth, so offer them with a meal.</li>
  </ul>

  <h2>What signs mean I should book sooner?</h2>
  <p>Don't wait for the next check-up if you notice:</p>
  <ul>
    <li>White, brown or black spots on the teeth, or a visible hole.</li>
    <li>Your child avoiding chewing on one side, or complaining of pain with sweets, hot or cold food.</li>
    <li>Swelling of the gum or face, or a small "pimple" on the gum near a tooth.</li>
    <li>A knock to the teeth, even if they look fine afterwards.</li>
    <li>Bleeding gums when brushing that doesn't settle within a week or two.</li>
  </ul>

  <h2>How often should children have dental check-ups?</h2>
  <p>Many children are seen about every six months, but the right interval depends on your child's teeth and their
  risk of decay. We advise you after the first visit.
  [[TBC: Arha's usual recall interval for children]]</p>
  <p>As your child grows, check-ups also let us watch how the adult teeth are coming through, and advise whether an
  orthodontic opinion would help. See our <a href="/treatments/kids-dentistry/">kids' dentistry</a> page for the care
  we provide, or <a href="/contact/#book">book your child's first visit</a>.</p>
faqs:
  - q: "Is it too early to bring my baby to the dentist?"
    a: "No. A first visit when the first tooth appears, or by the first birthday, is commonly recommended. It is mainly a short check and advice for you, and it helps your child get used to the dentist early."
  - q: "My child is scared of the dentist. What can I do?"
    a: "Tell us when you book. We keep the first visits short and gentle, explain each step in simple words, and never rush. Playing dentist at home and keeping your own language positive also helps."
  - q: "Should I use fluoride toothpaste for my toddler?"
    a: "Fluoride toothpaste in a very small amount, a smear about the size of a grain of rice, is commonly advised for children under three, with a pea-sized amount from three to six. We confirm the right amount for your child at the visit."
  - q: "Do cavities in baby teeth need treatment if the teeth will fall out?"
    a: "Often, yes. Decay in a baby tooth can cause pain and infection, and losing a baby tooth early can affect the space for the adult tooth. The dentist explains the options for your child's tooth, including when it is safe to watch and wait."
