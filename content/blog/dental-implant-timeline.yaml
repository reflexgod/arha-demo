h1: "How long does a dental implant take, from first visit to final tooth?"
excerpt: "Implant treatment happens in stages. Here is what each one involves, and why the healing time matters."
related: [dental-implants, missing-teeth, crowns-bridges-full-mouth-rehabilitation]
lead: >-
  Most people who ask about implants want to know one thing first: how long will it take? The honest answer is that
  it depends on your mouth, but the stages are the same for almost everyone, and knowing them makes the wait easier
  to plan around.
body: |
  <h2>Why does implant treatment take months rather than days?</h2>
  <p>A dental implant is a small post, usually titanium, that sits in the jawbone and holds a replacement tooth. What
  makes it strong is not the post itself but the bone that grows tightly against its surface. That bonding is a
  natural healing process, and it cannot be rushed safely. Most of the time an implant takes is the time your bone
  needs to heal around it.</p>
  <p>The other stages, planning, placing the implant and making the final tooth, take far less time. Knowing which
  stage you are in helps you plan work, travel and family events around your treatment.</p>

  <h2>What happens at the first consultation?</h2>
  <p>Treatment starts with an examination, a conversation about what you would like, and X-rays or a 3D scan to see
  the bone where the implant would go. The dentist looks at:</p>
  <ul>
    <li>How many teeth are missing, and where.</li>
    <li>How much bone there is, and how healthy the gums are.</li>
    <li>Your bite, and the teeth on either side of the gap.</li>
    <li>Your general health, any medicines you take, and whether you smoke.</li>
  </ul>
  <p>From this, you receive a plan with the options, the stages, the likely timeline and a written estimate. An
  implant is not always the right answer, and a good consultation also explains the alternatives, such as a bridge
  or a denture.</p>
  <p>At Arha, implant treatment is planned by Dr. Nikhil V. Jain, a prosthodontist. Prosthodontists specialise in
  restoring and replacing teeth, so the plan starts from the final tooth: its shape, its position in your bite, and
  how you will clean around it. The implant is then planned to support that tooth.</p>

  <h2>Is any preparation needed before the implant?</h2>
  <p>Many people need none. Some need one or more of these first:</p>
  <ul>
    <li><strong>Removing a tooth.</strong> If a damaged tooth is still in place, it is taken out. Sometimes the implant
    can be placed at the same visit; often the socket is left to heal first.</li>
    <li><strong>Gum treatment.</strong> Gum disease needs to be under control before an implant goes in, because the
    same problem can affect the tissue around an implant.</li>
    <li><strong>Bone grafting or a sinus lift.</strong> Where the bone is too thin or too low, it can be built up. The
    grafted area needs time to heal before, or while, the implant settles.
    [[TBC: whether bone grafting and sinus lifts are done at Arha || We explain whether you need this, and what it involves, at your consultation.]]</li>
  </ul>
  <p>Each of these adds time, which is why two people with the same gap can have very different timelines.</p>

  <h2>What happens on the day the implant is placed?</h2>
  <p>The implant is placed under local anaesthetic, so the area is numb. You are awake, and you can ask for a pause at
  any point. For a single implant the appointment is usually short. Afterwards, some tenderness and swelling for a few
  days is common, and you receive written aftercare instructions.</p>
  <p>In some cases a temporary tooth can be fixed to the implant the same day. In others, the implant is covered and
  left to heal undisturbed, and you wear a temporary tooth that does not press on it. Which approach suits you depends
  on the bone, the bite and where the tooth is. Our <a href="/blog/dental-implant-aftercare/">implant aftercare guide</a>
  covers the first week in detail.</p>

  <h2>How long does healing take?</h2>
  <p>This is usually the longest stage, typically measured in months. During it, the bone gradually bonds with the
  surface of the implant. You go about your normal life, and we review how the area is settling at follow-up visits.</p>
  <h3>What can make healing take longer?</h3>
  <ul>
    <li>Bone grafting or a sinus lift before or with the implant.</li>
    <li>Smoking, which slows healing and raises the risk of problems.</li>
    <li>Health conditions such as uncontrolled diabetes, or some medicines.</li>
    <li>Implants in softer bone, which can need longer to settle.</li>
  </ul>
  <p>If you have a condition or take regular medicines, tell us at the consultation. It does not always rule an
  implant out, but it can change the plan and the timeline.</p>

  <h2>How is the final tooth made and fitted?</h2>
  <p>Once the implant is firm, impressions or a digital scan are taken. The crown, bridge or denture is made to match
  the shape and shade of your other teeth. At the fitting appointment it is attached to the implant, checked against
  your bite and adjusted where needed. For larger cases, a trial stage lets you see and feel the new teeth before
  they are finished.</p>

  <h2>So how long does a dental implant take overall?</h2>
  <p>From the first consultation to the final tooth, treatment for a single implant usually takes a few months.
  Treatment that includes extractions, bone grafting or several implants takes longer. You receive your own timeline
  in writing after your consultation, so there are no surprises.
  [[TBC: Arha's typical timeline, as Dr. Nikhil V. Jain describes it]]</p>

  <h2>Can I plan the treatment around travel or a family event?</h2>
  <p>Usually, yes. The visits that need you in the chair are the consultation, the placement, the follow-ups and the
  fitting. The healing stage in between needs little of your time. Tell us about weddings, exams or trips when we
  plan, and we will try to arrange the stages around them. If you live outside Mumbai, ask us how the visits can be
  grouped.</p>

  <h2>What should I do next?</h2>
  <p>If you are wondering whether an implant suits you, read <a href="/blog/are-dental-implants-right-for-me/">are
  dental implants right for me?</a>, compare <a href="/blog/dental-implant-vs-bridge/">an implant and a bridge</a>,
  or see our <a href="/treatments/dental-implants/">dental implants</a> page. A consultation is the only way to get a
  timeline for your own mouth.</p>
faqs:
  - q: "Can I get a dental implant in one day?"
    a: "Sometimes a temporary tooth can be fixed to the implant on the day it is placed, but the bone still needs months to heal around it before the final tooth is fitted. Whether a same-day temporary tooth suits you depends on your bone and bite."
  - q: "Will I have a gap while the implant heals?"
    a: "Usually not. For front teeth especially, we plan a temporary tooth for the healing stage, either fixed or removable, so you are not left with a visible gap."
  - q: "Does bone grafting always add time?"
    a: "Yes, it usually does, because the grafted bone needs to heal. How much time it adds depends on the size of the graft and whether it is done before or at the same time as the implant."
  - q: "How many visits does implant treatment need?"
    a: "For a single implant, typically a consultation, the placement, one or more check-ups during healing, and one or two visits for the final tooth. Your written plan lists the visits for your case."
