lead: >-
  Root canal treatment has a reputation it doesn't really deserve. For most people, the worst pain comes before the
  treatment, from the infected tooth itself. Here is what the treatment involves, what you are likely to feel at each
  stage, and what you can do to make it easier.
body: |
  <h2>What is root canal treatment, in plain words?</h2>
  <p>Inside every tooth is a soft core called the pulp, which holds nerves and blood vessels. It runs down through
  narrow channels in the roots, the root canals. When decay, a crack or a deep filling lets bacteria reach the pulp, it
  becomes inflamed or infected. The tissue cannot heal on its own once this happens.</p>
  <p>Root canal treatment removes that tissue, cleans and shapes the canals, and seals them. The tooth stays in your
  mouth, and you keep chewing on it. The alternative is usually taking the tooth out, which leaves a gap that then
  needs replacing.</p>

  <h2>Where does the pain actually come from?</h2>
  <p>Most of the pain linked with root canals comes from the problem, not the cure. An inflamed or infected pulp can
  cause:</p>
  <ul>
    <li>A throbbing ache that keeps you awake.</li>
    <li>Sharp pain with hot or cold drinks that lingers after the drink is gone.</li>
    <li>Pain when you bite down, or a tooth that feels "high".</li>
    <li>Swelling of the gum or face near the tooth.</li>
  </ul>
  <p>Root canal treatment removes the source of that pain. Many people notice the throbbing settle soon after the
  first appointment.</p>

  <h2>Does root canal treatment hurt while it is being done?</h2>
  <p>The treatment is done under local anaesthetic, the same kind used for a filling. Once the tooth is numb, most
  people feel pressure and vibration rather than pain. The appointment can be long, so the more common complaint is a
  tired jaw from keeping the mouth open.</p>
  <p>A very inflamed tooth can be harder to numb. If you feel anything sharp, raise your hand: the dentist stops and
  adds more anaesthetic before carrying on. You should never have to "push through" pain in the chair.</p>
  <h3>What happens during the appointment?</h3>
  <ul>
    <li>The tooth is numbed and kept dry with a thin rubber sheet, which also stops anything falling into your mouth.</li>
    <li>A small opening is made in the top of the tooth to reach the pulp.</li>
    <li>The canals are cleaned with fine instruments and rinsed with disinfecting solutions.</li>
    <li>X-rays check the length and shape of each canal.</li>
    <li>The canals are filled and sealed, and the opening is closed with a filling.</li>
  </ul>
  <p>Some teeth are treated in one visit; others need two, with a medicated dressing in between.
  [[TBC: Arha's usual number of visits || Your dentist tells you how many visits your tooth needs before you begin.]]</p>

  <h2>Will it hurt afterwards?</h2>
  <p>Some tenderness for a few days is common, especially when you bite on the tooth. This is the tissue around the
  root settling, not the treatment failing. It usually eases day by day. We tell you which painkillers are suitable
  for you, taking your health and other medicines into account.</p>
  <p>Call us if you notice any of these:</p>
  <ul>
    <li>Pain that gets worse after a few days instead of better.</li>
    <li>New or increasing swelling.</li>
    <li>The temporary filling coming out.</li>
    <li>Your bite feeling uneven.</li>
  </ul>

  <h2>Why is a crown often needed after a root canal?</h2>
  <p>A tooth that needs root canal treatment has usually lost a lot of its structure to decay, old fillings or a crack.
  Back teeth, which take the most chewing force, are at risk of breaking afterwards. A crown covers and protects the
  tooth. Your dentist explains whether your tooth needs one and when it should be fitted. Delaying a recommended crown
  is a common reason a treated tooth later cracks.</p>

  <h2>How can I make the appointment easier?</h2>
  <ul>
    <li><strong>Come early rather than late.</strong> Treating a tooth before a severe infection sets in is usually
    simpler.</li>
    <li><strong>Eat beforehand</strong>, unless you have been told otherwise, as your mouth may be numb for a few hours
    afterwards.</li>
    <li><strong>Tell us if you are anxious.</strong> We can explain each step as we go, agree a stop signal, and plan
    breaks.</li>
    <li><strong>Bring your list of medicines</strong> and mention any health conditions, allergies or pregnancy.</li>
    <li><strong>Plan something gentle afterwards.</strong> Most people go back to work the same day, but a quiet
    evening helps.</li>
  </ul>

  <h2>Is it better to take the tooth out instead?</h2>
  <p>Sometimes a tooth is too broken or too badly affected to save, and taking it out is the right choice. When a
  tooth can be saved, though, keeping it is usually the better option. Your own tooth keeps the bone and the
  neighbouring teeth in place, and replacing a missing tooth with an implant, bridge or denture involves its own
  treatment and cost. We explain both options honestly so you can decide. Our
  <a href="/treatments/missing-teeth/">missing teeth</a> page covers the replacement options.</p>

  <h2>What should I do if I have toothache now?</h2>
  <p>Don't wait for it to settle on its own: a tooth that has stopped hurting can still be infected. Call us, and if
  you have swelling of the face, trouble swallowing or a fever, seek urgent care. Our
  <a href="/emergency-dentist-south-mumbai/">emergency dentistry</a> page explains how we handle urgent appointments,
  and the <a href="/treatments/root-canal-treatment/">root canal treatment</a> page covers the treatment in more
  detail.</p>
faqs:
  - q: "Is root canal treatment more painful than having a tooth out?"
    a: "Both are done under local anaesthetic, so neither should be sharply painful during treatment. Some tenderness afterwards is normal with both. The bigger difference is the result: a root canal keeps your tooth, while an extraction leaves a gap that may need replacing."
  - q: "Can I drive and go to work after a root canal?"
    a: "Most people can, as local anaesthetic doesn't affect your ability to drive. Your lip and cheek may stay numb for a few hours, so take care with hot drinks and avoid chewing on that side until the feeling returns."
  - q: "Why does my tooth still feel sore a few days later?"
    a: "The tissue around the root can stay tender for several days while it settles. If the soreness is getting worse rather than better, or you notice swelling, call us so we can check the tooth."
  - q: "Can a root canal be done during pregnancy?"
    a: "Dental infections should not be left untreated in pregnancy, and treatment under local anaesthetic is often possible. Tell us you are pregnant before the appointment so we can plan X-rays, timing and medicines with your safety in mind."
